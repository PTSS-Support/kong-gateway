name: 🚀 Deploy Kong Gateway to Development

on:
  push:
    branches: [ development ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (optional)'
        required: false
        default: 'latest'

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.generate_tag.outputs.version }}
      repo_name: ${{ steps.repo_name.outputs.name }}
    steps:
      - uses: actions/checkout@v3

      - name: Set Repository Name
        id: repo_name
        run: |
          echo "name=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Generate Version Tag
        id: generate_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.tag }}" != "latest" ]; then
            echo "version=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "version=$(date +'%Y%m%d')-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.PACKAGE_PAT }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Kong Image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.name }}:${{ steps.generate_tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: package
    runs-on: ubuntu-latest
    environment: development
    steps:
      - uses: actions/checkout@v3

      - name: Install OpenShift CLI
        run: |
          curl -LO https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz
          tar -xvf openshift-client-linux.tar.gz -C /usr/local/bin
          chmod +x /usr/local/bin/oc

      - name: Login to OpenShift
        run: |
          oc login --token=${{ secrets.OSC_DEV_TOKEN }} --server=${{ secrets.OSC_SERVER }}

      - name: Create ConfigMap for Custom Plugins
        run: |
          # Create ConfigMap for Lua files
          oc create configmap kong-custom-plugins \
            --from-file=custom-auth/handler.lua=plugins/custom-auth/handler.lua \
            --from-file=custom-auth/schema.lua=plugins/custom-auth/schema.lua \
            -n ${{ vars.OSC_DEV_PROJECT }} \
            --dry-run=client -o yaml | oc apply -f -

      - name: Deploy Kong Gateway
        run: |
          # Update image in deployment
          oc set image deployment/kong-gateway \
            kong=ghcr.io/${{ needs.package.outputs.repo_name }}:${{ needs.package.outputs.image_tag }} \
            -n ${{ vars.OSC_DEV_PROJECT }}

          # Apply all Kong resources
          oc apply -f kong-service.yaml
          oc apply -f kong-route.yaml

      - name: Wait for Deployment
        run: |
          oc rollout status deployment/kong-gateway -n ${{ vars.OSC_DEV_PROJECT }} --timeout=300s

      - name: Verify Deployment
        run: |
          READY_PODS=$(oc get deployment kong-gateway -n ${{ vars.OSC_DEV_PROJECT }} -o jsonpath='{.status.readyReplicas}')
          DESIRED_PODS=$(oc get deployment kong-gateway -n ${{ vars.OSC_DEV_PROJECT }} -o jsonpath='{.spec.replicas}')
          
          if [ "$READY_PODS" != "$DESIRED_PODS" ]; then
            echo "❌ Deployment verification failed: $READY_PODS/$DESIRED_PODS pods ready"
            exit 1
          fi
          
          echo "✅ Deployment verification successful: $READY_PODS/$DESIRED_PODS pods ready"