apiVersion: batch/v1
kind: Job
metadata:
  name: kong-migration
  namespace: hotel-dev
spec:
  template:
    spec:
      containers:
        - name: kong-migration
          image: kong:3.4
          command: [ "kong", "migrations", "bootstrap" ]
          env:
            - name: KONG_DATABASE
              value: "postgres"
            - name: KONG_PG_HOST
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: POSTGRESQL_DB_HOST
            - name: KONG_PG_USER
              valueFrom:
                secretKeyRef:
                  name: kong-gateway-secrets
                  key: POSTGRESQL_DB_USERNAME
            - name: KONG_PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kong-gateway-secrets
                  key: POSTGRESQL_DB_PASSWORD
            - name: KONG_PG_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: env-config
                  key: POSTGRESQL_DB_NAME
            - name: KONG_PG_SSL
              value: "on"
            - name: KONG_PG_SSL_VERIFY
              value: "off"
      restartPolicy: OnFailure